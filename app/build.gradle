plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codex.expensekeeper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.codex.expensekeeper'
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
